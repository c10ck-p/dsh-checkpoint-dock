name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1; no NODE_AUTH_TOKEN is used, the
      # OIDC token from `id-token: write` authenticates the publish instead.
      - name: Check npm version
        run: |
          node -e "
            const version = require('child_process').execSync('npm --version').toString().trim();
            const [major, minor] = version.split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error('npm ' + version + ' is too old for trusted publishing');
              process.exit(1);
            }
            console.log('npm ' + version);
          "

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "
            const tag = String(process.env.RELEASE_TAG || '').replace(/^v/, '');
            const version = require('./package.json').version;
            if (tag !== version) {
              console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match package.json version ' + version);
              process.exit(1);
            }
            console.log('Publishing ' + version);
          "

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance
